<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title> Cart </title>

    <link rel="icon" href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo" type="image/gif" sizes="16x16">

</head>
<body>
    
    <div id="1"></div>

    <div id="cartMainContainer">
        <h1> Checkout </h1>
        <h3 id="totalItem"> Total Items: 0 </h3>

        <div id="cartContainer">
            </div>
    </div>

    <div id="4"></div>
    
    <script src="loader.js"></script>

    <script type="module">
        
        async function initializePage() {
            try {
                console.log("Starting async content loading...");
                
                // Load header and footer content asynchronously, waiting for each
                await loadAsync("1", "header.html"); // Load Header
                await loadAsync("4", "footer.html"); // Load Footer

                console.log("Header and Footer loaded. Running cart logic...");
                
                // Dynamically import cart scripts after all HTML containers are present.
                // NOTE: Adjust paths if your JS files are in a 'js/' folder (e.g., './js/cart-storage.js').
                const cartStorage = await import('./cart-storage.js');
                const cartModule = await import('./cart.js');
                
                // If cart.js is structured correctly, the rendering starts automatically
                // after the imports execute.

            } catch (error) {
                console.error("Cart page failed to initialize:", error);
            }
        }
        
        // Start the loading process
        initializePage();
    </script>
</body>
</html>

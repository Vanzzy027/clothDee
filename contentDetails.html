<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title> CONTENT DETAILS </title>
    
    <link rel="icon" href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo" type="image/gif" sizes="16x16">
    <link rel="stylesheet" href="css/contentDetails.css">
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="1"></div> 
    
    <div id="containerProduct">
    </div>
    
    <div id="4"></div>
    
    <script src="js/loader.js"></script>

    <script type="module">
        // 2. Import utility functions statically for scope access
        // This is the cleanest way to ensure functions like updateCartBadge are available globally if needed.
        import { updateCartBadge } from './cart-storage.js'; 
        
        async function initializePage() {
            try {
                // AWAIT ensures header loads before proceeding
                await loadAsync("1", "header.html");
                
                // AWAIT ensures footer loads before proceeding
                await loadAsync("4", "footer.html"); 

                console.log("Header and Footer loaded. Running product details logic...");
                
                // 3. Dynamically import the MAIN logic script.
                // It will rely on cart-storage being loaded by the static import above.
                const contentDetailsModule = await import('./js/contentDetails.js');
                
                // Initialize the badge after the header content has been injected
                updateCartBadge();

            } catch (error) {
                console.error("Product Details page failed to initialize:", error);
            }
        }
        
        // Start the loading process
        initializePage();
    </script>
</body>
</html>

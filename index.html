<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Compatible" content="ie=edge">
    <title>Dee Web</title>
    <link rel="icon" href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo" type="image/gif" sizes="16x16">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet">
    <script src="js/jQuery3.4.1.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css">
</head>

<body>
    <div id="1"></div> <div id="2"></div> <div id="3"></div> <div id="4"></div> <script src="js/loader.js"></script> 

    <script type="module">
        // 🔑 FIX 1: UNCOMMENTED and corrected path for cart-storage import
        import { updateCartBadge } from './cart-storage.js'; 

        async function initializePage() {
            try {
                console.log("Starting async loading...");
                
                // Load HTML Partials
                await loadAsync("1", "header.html"); 
                await loadAsync("2", "slider.html"); 
                await loadAsync("3", "content.html"); 
                await loadAsync("4", "footer.html"); 

                console.log("All HTML partials loaded. Running content scripts...");

                // 🔑 FIX 2: Corrected path for content.js dynamic import
                const contentModule = await import('./content.js'); 
                
                // This call is now possible because cart-storage.js was imported above.
                updateCartBadge(); 

            } catch (error) {
                console.error("Page initialization failed. Check network and file paths.", error);
            }
        }
        
        initializePage();
    </script> 

    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>
    <script>
        // Use a slight timeout to ensure the slider HTML (#containerSlider) is loaded by loadAsync
        setTimeout(function() {
            // Ensure jQuery is loaded before this runs
            if (window.jQuery && $('#containerSlider').slick) {
                $('#containerSlider').slick({
                    dots: true,
                    infinite: true,
                    slidesToShow: 1,
                    slidesToScroll: 1,
                    autoplay: true,
                    autoplaySpeed: 4500,
                });
            } else {
                 console.error("jQuery or Slick Carousel not loaded.");
            }
        }, 500); 
    </script>
</body>
</html>
